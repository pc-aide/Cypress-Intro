name: Auth Pipeline

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Quel scénario exécuter ?"
        required: true
        default: "login"
        type: choice
        options:
          - login
          - mdp_oublie

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Login
        if: ${{ github.event.inputs.scenario == 'login' }}
        run: |
          echo "Scénario LOGIN"
          echo "Username: ${{ secrets.LOGIN_USER }}"
          echo "Password: ${{ secrets.LOGIN_PASS }}"
          # npm run test:login

      - name: Test MDP oublié
        if: ${{ github.event.inputs.scenario == 'mdp_oublie' }}
        run: |
          echo "Scénario MDP OUBLIE"
          echo "Email: ${{ secrets.RECOVERY_EMAIL }}"
          # npm run test:mdp-oublie
