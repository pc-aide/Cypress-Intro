name: Auth Pipeline

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Quel scénario exécuter ?"
        required: true
        default: "login"
        type: choice
        options:
          - login
          - mdp_oublie

jobs:
  login:
    if: ${{ github.event.inputs.scenario == 'login' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "LOGIN"
          echo "User=${{ secrets.LOGIN_USER }}"
          echo "Pass=${{ secrets.LOGIN_PASS }}"

  mdp_oublie:
    if: ${{ github.event.inputs.scenario == 'mdp_oublie' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "MDP oublié"
          echo "Email=${{ secrets.RECOVERY_EMAIL }}"
