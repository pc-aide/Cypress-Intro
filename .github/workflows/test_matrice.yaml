name: Pipeline Auth

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Quel scénario tester ?"
        required: true
        default: "login"
        type: choice
        options:
          - login
          - mdp_oublie
      username:
        description: "Nom d'utilisateur"
        required: false
      password:
        description: "Mot de passe"
        required: false
      email:
        description: "Email (pour MDP oublié)"
        required: false

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exécution du test login
        if: ${{ github.event.inputs.scenario == 'login' }}
        run: |
          echo "Scénario: Login"
          echo "Username: ${{ github.event.inputs.username }}"
          echo "Password: ${{ github.event.inputs.password }}"
          # ici ton vrai script pour login

      - name: Exécution du test MDP oublié
        if: ${{ github.event.inputs.scenario == 'mdp_oublie' }}
        run: |
          echo "Scénario: Mot de passe oublié"
          echo "Email: ${{ github.event.inputs.email }}"
          # ici ton vrai script pour reset MDP
