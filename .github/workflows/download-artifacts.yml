name: Cypress Tests

on: push

jobs:
  run-cypress:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installer Cypress dans le dossier ./cypress
      - name: Install Cypress
        run: npm install cypress --save-dev
        working-directory: ./cypress

      # Run Cypress tests
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./cypress           # pointe sur le dossier contenant cypress.config.js
          spec: "e2e/rds.cy.js"                 # chemin relatif à working-directory
          browser: chrome
          headed: false
          record: false
          publish-summary: true
        continue-on-error: true

      # Upload screenshots
      - name: Store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: ./cypress/cypress/screenshots

      # Upload videos
      - name: Store videos
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: ./cypress/cypress/videos
