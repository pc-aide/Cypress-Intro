name: Cypress Tests

on: push

jobs:
  run-cypress:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installer Cypress
      - name: Install Cypress
        run: npm install cypress --save-dev

      # Run Cypress tests avec chemin complet pour config et spec
      - name: Run Cypress tests
        run: npx cypress run \
          --config-file cypress/cypress.config.js \
          --spec "cypress/e2e/rds.cy.js" \
          --browser chrome \
          --headless || true

      # Upload screenshots
      - name: Store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      # Upload videos
      - name: Store videos
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
