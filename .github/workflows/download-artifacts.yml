name: Cypress Tests

on: push

jobs:
  run-cypress:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run Cypress tests using the official GitHub Action
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          spec: "cypress/e2e/rds.cy.js"
          browser: chrome
          headless: true
        continue-on-error: true   # équivalent de ton "|| true"

      # Upload screenshots
      - name: Store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      # Upload videos
      - name: Store videos
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
